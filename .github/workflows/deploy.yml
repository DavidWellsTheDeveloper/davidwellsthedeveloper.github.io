# Deploy the David T. Wells digital resume.
#
# Triggered on pushes to `main` (and manual runs), this workflow deploys to BOTH:
#   1. GitHub Pages      -> https://davidwellsthedeveloper.github.io
#   2. AWS S3 + CloudFront -> https://davidwellsthedeveloper.com
#
# AWS auth uses GitHub OIDC (no long-lived keys). The role is scoped, via its
# trust policy, to this repository's `main` branch only.
#
# Required repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SITE_URL                        e.g. https://davidwellsthedeveloper.com
#   AWS_S3_BUCKET                   e.g. david-wells-portfolio
#   AWS_REGION                      e.g. us-east-1
#   AWS_CLOUDFRONT_DISTRIBUTION_ID  e.g. E2NTRDLIQ8P40E
#   AWS_DEPLOY_ROLE_ARN             e.g. arn:aws:iam::490004655825:role/ResumePortfolioDeployRole

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; never cancel an in-flight Pages deploy.
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build once; both deploy jobs consume the same static output.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'david-wells-resume/package-lock.json'

      - name: Install dependencies
        working-directory: ./david-wells-resume
        run: npm ci

      - name: Quality checks
        working-directory: ./david-wells-resume
        run: |
          npm run test:run
          npm run lint
          npm run format:check

      - name: Generate static site
        working-directory: ./david-wells-resume
        env:
          NODE_ENV: production
          NUXT_PUBLIC_APP_URL: ${{ vars.SITE_URL || 'https://davidwellsthedeveloper.com' }}
          NUXT_PUBLIC_APP_NAME: 'David T. Wells - Digital Resume'
          NUXT_PUBLIC_APP_DESCRIPTION: 'Professional digital resume for David T. Wells — data platforms, analytics, and full-stack software engineering'

          # Constitutional principles (enforced)
          NUXT_PUBLIC_AUTHENTIC_REPRESENTATION: true
          NUXT_PUBLIC_CLEAN_DESIGN: true
          NUXT_PUBLIC_FAST_LOADING: true

          # Performance targets
          NUXT_PUBLIC_TARGET_LOAD_TIME: 3000
          NUXT_PUBLIC_TARGET_FCP: 1500
          NUXT_PUBLIC_TARGET_LCP: 2500

          # Security
          NUXT_PUBLIC_CSP_ENABLED: true
        run: npm run generate

      - name: Report build size
        working-directory: ./david-wells-resume
        run: du -sh .output/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './david-wells-resume/.output/public'

      - name: Upload site artifact (for AWS)
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: './david-wells-resume/.output/public'
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: site

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync site/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html"

      - name: Sync HTML (short cache)
        run: |
          aws s3 sync site/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --cache-control "max-age=3600,public" \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8"

      - name: Configure S3 website hosting
        run: |
          aws s3 website "s3://${{ vars.AWS_S3_BUCKET }}" \
            --index-document index.html \
            --error-document 404.html

      - name: Invalidate CloudFront cache
        if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
