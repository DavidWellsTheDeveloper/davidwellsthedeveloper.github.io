<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    
    <!-- Geometric shape gradients -->
    <linearGradient id="shape1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.2" />
    </linearGradient>
    
    <linearGradient id="shape2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.15" />
    </linearGradient>
    
    <linearGradient id="shape3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.12" />
    </linearGradient>
    
    <!-- Blur filter for depth -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  
  <!-- Large geometric shapes for parallax layers -->
  <!-- Layer 1: Far background (slowest parallax) -->
  <g class="parallax-layer-1" opacity="0.6">
    <polygon points="0,0 600,0 400,400 0,600" fill="url(#shape1)" filter="url(#blur)"/>
    <polygon points="1920,1080 1320,1080 1520,680 1920,480" fill="url(#shape1)" filter="url(#blur)"/>
  </g>
  
  <!-- Layer 2: Mid background -->
  <g class="parallax-layer-2" opacity="0.4">
    <circle cx="300" cy="200" r="150" fill="url(#shape2)" filter="url(#blur)"/>
    <circle cx="1600" cy="800" r="200" fill="url(#shape2)" filter="url(#blur)"/>
    <polygon points="1920,0 1500,0 1700,300 1920,400" fill="url(#shape3)" filter="url(#blur)"/>
  </g>
  
  <!-- Layer 3: Near background (fastest parallax) -->
  <g class="parallax-layer-3" opacity="0.3">
    <polygon points="800,1080 1200,1080 1000,700 600,800" fill="url(#shape1)"/>
    <polygon points="1200,0 1600,0 1400,300 1000,200" fill="url(#shape3)"/>
    <circle cx="200" cy="900" r="100" fill="url(#shape2)"/>
    <circle cx="1700" cy="300" r="120" fill="url(#shape1)"/>
  </g>
  
  <!-- Subtle grid overlay for tech aesthetic -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#3b82f6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
</svg>